<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
/* Luys Map in its own language: violet evening sky, Ararat with snow, Yerevan's rose-coloured skyline with lit
   windows, the drop-and-bolt pins rising over the city, and the app standing in the middle of it. */
body{background:linear-gradient(180deg,#3e2bb8 0%,#5a40d8 38%,#8a6ee8 72%,#b79cf2 100%)}
.stars{position:absolute;inset:0 0 50% 0;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.2px 1.2px at 46% 22%,#fff,transparent),radial-gradient(1px 1px at 63% 6%,#fff,transparent),radial-gradient(1.6px 1.6px at 78% 30%,#fff,transparent),radial-gradient(1px 1px at 90% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 6% 40%,#fff,transparent),radial-gradient(1px 1px at 38% 36%,#fff,transparent);opacity:.75}
.moon{position:absolute;left:712px;top:40px;width:52px;height:52px;border-radius:50%;background:#f7dcc0;box-shadow:0 0 40px 10px rgba(247,220,192,.35)}
svg.land{position:absolute;left:0;top:0;width:800px;height:600px}
.ic{left:44px;top:46px;width:88px;height:88px}
.word{position:absolute;left:150px;top:52px;color:#fff;font-family:ui-rounded,"SF Pro Rounded","Archivo",sans-serif}
.word b{display:block;font-size:58px;font-weight:800;letter-spacing:-.02em;line-height:1}
.word span{display:block;margin-top:8px;font-size:19px;font-weight:600;opacity:.9}
.chips{position:absolute;left:46px;top:166px;display:flex;gap:8px}
.chips span{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font:700 14px ui-rounded,"Archivo",sans-serif}
.p1{width:200px;left:528px;top:120px;transform:rotate(4deg);z-index:1}
.alert{position:absolute;left:290px;top:236px;width:290px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.97);display:grid;grid-template-columns:38px 1fr;gap:1px 11px;box-shadow:0 22px 44px -14px rgba(30,10,90,.65);color:#1b1340;font-family:ui-rounded,"Archivo",sans-serif;z-index:3}
.alert .a{grid-row:span 3;width:38px;height:38px;border-radius:10px;overflow:hidden}.alert .a img{width:100%;height:100%;object-fit:cover}
.alert b{font-size:13.5px}.alert .t{font-size:11.5px;color:#7a72a3}
.alert .m{font-size:14px;font-weight:700;line-height:1.3}
.pin{position:absolute;width:44px;height:56px;filter:drop-shadow(0 10px 10px rgba(30,10,90,.45));z-index:2}
svg.front{position:absolute;left:0;top:0;width:800px;height:600px;z-index:4}
</style></head><body>
<div class="stars"></div><div class="moon"></div>
<svg class="land" viewBox="0 0 800 600" aria-hidden="true">
  <g transform="translate(-120 0)"><path d="M90 500 L320 318 Q336 306 352 318 L470 404 L524 372 Q534 366 544 372 L720 500 Z" fill="#a690f2"/>
  <path d="M292 340 L320 318 Q336 306 352 318 L386 342 L366 350 L350 335 L334 354 L314 340 Z" fill="#fff"/>
  <path d="M510 381 L524 372 Q534 366 544 372 L560 384 L544 388 L532 379 L520 388 Z" fill="#fff"/></g>
  <g id="back"></g>
</svg>
<div class="phone p1"><img src="../../../assets/img/built/luys-map/home.webp" alt=""></div>
<svg class="pin" style="left:300px;top:404px" viewBox="0 0 44 56"><path d="M22 54C22 54 3 34 3 21a19 19 0 0 1 38 0C41 34 22 54 22 54z" fill="#6754e5" stroke="#fff" stroke-width="3"/><circle cx="22" cy="21" r="11" fill="#fff"/><path d="M24 12l-7 11h5l-2 8 7-11h-5z" fill="#f5a524"/></svg>
<svg class="pin" style="left:440px;top:378px;transform:scale(.8)" viewBox="0 0 44 56"><path d="M22 54C22 54 3 34 3 21a19 19 0 0 1 38 0C41 34 22 54 22 54z" fill="#3b9bff" stroke="#fff" stroke-width="3"/><path d="M22 11c4 5 7 9 7 12a7 7 0 0 1-14 0c0-3 3-7 7-12z" fill="#fff"/></svg>
<svg class="pin" style="left:744px;top:350px;transform:scale(.75)" viewBox="0 0 44 56"><path d="M22 54C22 54 3 34 3 21a19 19 0 0 1 38 0C41 34 22 54 22 54z" fill="#ef4d5a" stroke="#fff" stroke-width="3"/><path d="M22 10c2 4 7 7 7 13a7 7 0 0 1-14 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4 1-7 2-10z" fill="#fff"/></svg>
<div class="icon ic"><img src="../../../assets/img/built/luys-map/brand-icon.webp" alt=""></div>
<div class="word"><b>Luys Map</b><span>Yerevan outages, on a map</span></div>
<div class="chips"><span>926 people</span><span>11,316 alerts sent</span></div>
<div class="alert"><span class="a"><img src="../../../assets/img/built/luys-map/brand-icon.webp" alt=""></span><b>Luys Map</b><span class="t">now</span><span class="m">⚡ Power cut tomorrow, 11:00–15:00 at Home</span></div>
<svg class="front" viewBox="0 0 800 600" aria-hidden="true"><g id="front"></g></svg>
<script>
// a seeded skyline, the same on every render: a lighter back row behind the phone, a darker front row over it
let s = 11; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
function row(id, minH, maxH, colors, lit, win) {
  const g = document.getElementById(id); let x = -10, out = '';
  while (x < 810) {
    const w = 34 + r() * 46, h = minH + r() * (maxH - minH), c = colors[Math.floor(r() * colors.length)], y = 600 - h;
    out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h + 2}" fill="${c}"/>`;
    for (let wy = y + 12; wy < 590; wy += 18) for (let wx = x + 8; wx < x + w - 10; wx += 14)
      out += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="7" height="9" rx="1" fill="${r() < lit ? '#ffd98a' : win}"/>`;
    x += w + 3;
  }
  g.innerHTML = out;
}
row('back', 110, 190, ['#c48fb2', '#b27ea6', '#cf9bb8'], .22, 'rgba(90,50,120,.35)');
row('front', 46, 96, ['#7a4b8f', '#6b3f83', '#86549a'], .4, 'rgba(40,20,70,.45)');
</script>
</body></html>
