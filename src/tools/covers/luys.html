<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
body{background:radial-gradient(120% 90% at 70% 40%,#3a2a8f 0%,#1d1650 45%,#0e0b2a 100%)}
.heat{position:absolute;inset:-40px;background:url(../../../assets/img/built/luys-map/heat-city.webp) center/cover;opacity:.3;mix-blend-mode:screen;filter:saturate(1.5) blur(6px)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(80% 80% at 60% 50%,#000,transparent)}
.glow{position:absolute;width:420px;height:420px;left:390px;top:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,60,.45),transparent 65%);filter:blur(10px)}
.p1{width:250px;left:448px;top:64px;transform:rotate(6deg)}
.p2{width:210px;left:300px;top:150px;transform:rotate(-5deg);opacity:.92}
.alert{left:44px;top:150px;width:300px;padding:16px 18px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;font-size:13px;color:#14121f}
.alert .av{grid-row:span 3;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6b5cff,#3a2a8f);display:grid;place-items:center;color:#ffd166;font-size:22px}
.alert b{font-size:14px}.alert .t{color:#6b6880;font-size:12px}
.alert .m{font-size:15px;font-weight:600;line-height:1.35}
.chip{position:absolute;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(20,16,50,.72);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(8px)}
.chip i{width:10px;height:10px;border-radius:50%}
.c1{left:70px;top:330px}.c2{left:120px;top:384px}.c3{left:60px;top:438px}
</style></head><body>
<div class="heat"></div><div class="grid"></div><div class="glow"></div>
<div class="phone p2"><img src="../../../assets/img/built/luys-map/insights.webp" alt=""></div>
<div class="phone p1"><img src="../../../assets/img/built/luys-map/home.webp" alt=""></div>
<div class="card alert"><span class="av">⚡</span><b>Luys Map</b><span class="t">bot · now</span><span class="m">Power cut tomorrow, 11:00 to 15:00, at Home in Kentron</span></div>
<div class="chip c1"><i style="background:#f5a524"></i>Power · Ajapnyak · planned</div>
<div class="chip c2"><i style="background:#3b9bff"></i>Water back early · Arabkir</div>
<div class="chip c3"><i style="background:#ff5a4f"></i>Gas · Nor Nork · emergency</div>
</body></html>
