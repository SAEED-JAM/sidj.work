<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
body{background:radial-gradient(70% 80% at 30% 25%,#6a4426 0%,#2c1a0e 55%,#140b05 100%)}
.lamp{position:absolute;left:60px;top:-80px;width:520px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,120,.35),transparent 62%)}

.disc{position:absolute;left:40px;top:110px;width:400px;height:400px;border-radius:50%;

.p1{width:220px;left:540px;top:60px;transform:rotate(5deg)}
