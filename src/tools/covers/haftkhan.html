<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
/* the game's own art, its Rostam icon and its logo */
body{background:#1b120a url(../../../assets/img/built/haftkhan/brand-scene.webp) 62% 50%/auto 100% no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,9,2,.82) 0%,rgba(18,9,2,.45) 40%,transparent 70%),linear-gradient(0deg,rgba(18,9,2,.6),transparent 35%)}
.ic{left:44px;top:46px;width:150px;height:150px;border:4px solid #f4c45a;box-shadow:0 0 0 3px #7a4a14,0 22px 44px -10px rgba(0,0,0,.7)}
.logo{position:absolute;left:34px;top:214px;width:330px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.sub{position:absolute;left:46px;top:330px;font-family:"Lilita",sans-serif;font-size:24px;color:#ffe2a0;text-shadow:0 2px 0 #5a3008}

.cast{position:absolute;right:30px;bottom:26px;display:flex;align-items:flex-end;gap:6px}
.cast img{height:70px;image-rendering:pixelated;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}

<div class="shade"></div>
<div class="icon ic"><img src="../../../assets/img/built/haftkhan/brand-icon.webp" alt=""></div>

<div class="sub">Seven labours from the Shahnameh</div>
<div class="pill"><span>On Cafe Bazaar</span><span>Persian + English</span></div>
<div class="cast"><img src="../../../assets/img/built/haftkhan/anim-rostam.webp" alt=""><img src="../../../assets/img/built/haftkhan/anim-rakhsh.webp" style="height:80px" alt=""><img src="../../../assets/img/built/haftkhan/anim-lion.webp" alt=""></div>
</body></html>
